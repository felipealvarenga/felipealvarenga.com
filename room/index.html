<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felipe Alvarenga, the room</title>
<meta name="description" content="The hi-fi version of felipealvarenga.com: an agent control room. Click a screen.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://felipealvarenga.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101114'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='16' font-weight='600' fill='%23f3f3f5'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap">
<style>
:root{color-scheme:dark;--bg:oklch(10% 0.005 250);--row:oklch(19% 0.006 250);--ink:oklch(96% 0.003 250);--muted:oklch(66% 0.008 250);--line:oklch(26% 0.006 250);--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:.2em}
a:hover{text-decoration-color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px}
#gl{position:fixed;inset:0;display:block;opacity:0;transition:opacity 1.4s ease-out}
#gl.on{opacity:1}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--ink);z-index:5;transition:width .25s,opacity .6s 1s}
#gl.on~#bar{opacity:0}
nav{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:baseline;padding:1.25rem clamp(1rem,4vw,2rem);font-size:.9rem}
nav b{font-weight:500}
nav a{text-decoration:none}
nav ul{display:flex;gap:1.25rem;margin:0;padding:0;list-style:none;color:var(--muted)}
nav ul a:hover,nav ul a[aria-current]{color:var(--ink)}
nav .mode{font:400 .75rem/1 var(--mono);letter-spacing:.08em}
#gate{position:fixed;inset:0;z-index:2;background:var(--bg);transition:opacity 1s ease-out}
#gate.out{opacity:0;pointer-events:none}
#status{position:fixed;left:clamp(1rem,4vw,2rem);bottom:1.25rem;z-index:4;font:400 .75rem/1 var(--mono);letter-spacing:.06em;color:var(--muted)}
#label{position:fixed;z-index:3;pointer-events:none;font:400 .75rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:oklch(10% 0.005 250 / .85);border:1px solid var(--line);padding:.45rem .65rem;border-radius:.3rem;transform:translate(.9rem,.9rem);opacity:0;transition:opacity .15s}
#label.on{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:1.25rem;z-index:3;text-align:center;font:400 .75rem/1 var(--mono);letter-spacing:.06em;color:var(--muted);opacity:0;transition:opacity 1s 1.2s;pointer-events:none}
#hint.on{opacity:1}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(30rem,100vw);z-index:4;background:oklch(12% 0.005 250 / .92);backdrop-filter:blur(14px);border-left:1px solid var(--line);padding:5rem clamp(1.25rem,3vw,2rem) 2rem;overflow:auto;transform:translateX(100%);transition:transform .6s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column;gap:1rem}
#panel.on{transform:none}
#panel header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
#panel h2{font:500 .8rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
#panel-back{background:none;border:1px solid var(--line);color:var(--ink);font:400 .75rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.5rem .7rem;border-radius:999px;cursor:pointer}
#panel-back:hover{border-color:var(--ink)}
#panel p{max-width:62ch;margin:0 0 1rem;color:var(--muted)}
#panel p b{color:var(--ink);font-weight:500}
.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:3.5rem 1fr auto;gap:.25rem .9rem;align-items:baseline;padding:.65rem .5rem;margin:0 -.5rem;border-radius:.4rem;text-decoration:none}
a.row:hover{background:var(--row)}
.row time,.row .meta{font:400 .75rem/1.6 var(--mono);color:var(--muted);white-space:nowrap}
.row .meta{text-align:right}
.row span{display:block}
.row small{display:block;font-size:.88rem;color:var(--muted)}
@media (max-width:700px){
  #panel{top:auto;left:0;width:auto;height:70vh;border-left:0;border-top:1px solid var(--line);padding-top:1.25rem;transform:translateY(100%)}
  .row{grid-template-columns:3.5rem 1fr}.row .meta{grid-column:2;text-align:left}
  nav{padding:1rem}nav b{display:none}nav ul{gap:.8rem;font-size:.85rem}nav .mode{font-size:.65rem}nav li:has(a[aria-current]){display:none}
}
#fallback{display:none;position:fixed;inset:0;z-index:6;place-items:center;background:var(--bg);padding:2rem;text-align:center}
#fallback p{max-width:32ch;color:var(--muted)}
@media (prefers-reduced-motion:reduce){#gl,#gate,#panel{transition:none}}
</style>
</head>
<body>
<nav aria-label="Site"><b><a href="/">Felipe Alvarenga</a></b><ul><li><a href="/#ai" data-key="ai">AI</a></li><li><a href="/#work" data-key="work">Work</a></li><li><a href="/writing/" data-key="writing">Writing</a></li><li><a href="/#press" data-key="press">Press</a></li><li><a class="mode" href="/?lofi=1">LO-FI</a></li><li><a class="mode" href="/room/" aria-current="page">HI-FI</a></li></ul></nav>
<canvas id="gl" aria-label="A dark control room with a wall of screens, each one an agent at work. Click a screen to open a section of the site."></canvas>
<div id="bar" role="progressbar" aria-label="Loading the room"></div>
<div id="gate" aria-hidden="true"></div>
<div id="status" aria-live="polite"></div>
<div id="label"></div>
<div id="hint" aria-hidden="true">CLICK A SCREEN · DRAG TO LOOK · ESC FOR LO-FI</div>
<aside id="panel" aria-hidden="true" aria-labelledby="panel-title"><header><h2 id="panel-title">Section</h2><button id="panel-back" type="button">Back to the room</button></header><div id="panel-body"></div></aside>
<div id="fallback"><div><p>This browser can't draw the room. The reading version has everything.</p><p><a href="/?lofi=1">Go lo-fi</a></p></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
